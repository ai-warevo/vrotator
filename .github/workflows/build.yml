name: Automated Release Pipeline

on:
  push:
    tags:
      - 'v*' # Triggers strictly when a version tag is pushed (e.g., v1.0.0)

permissions:
  contents: write

jobs:
  matrix_build:
    name: Compile Core & Package AddOn
    runs-on: windows-2022

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set Up Microsoft Visual Studio Build Tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set Up Developer CMake Environment
        uses: lukka/get-cmake@latest

      - name: Configure CMake Build Meta-Files
        run: cmake -B build -DENABLE_VROTATOR_TESTS=OFF

      - name: Execute MSVC Monolithic Release Compilation
        run: cmake --build build --config Release

      - name: Validate Binary Target Existence
        shell: bash
        run: |
          if [ ! -f "build/Release/vrotator_clicker.exe" ]; then
            echo "Critical Error: Target binary artifact compilation failed!"
            exit 1
          fi

      - name: Compress Game AddOn Directory into Archive
        shell: bash
        run: |
          # Compress the vrotator workspace folder directly to avoid double nesting issues
          powershell Compress-Archive -Path "vrotator" -DestinationPath "build/Release/vrotator_addon.zip" -Force

      - name: Generate Automated GitHub Release Draft
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: Release \${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## 🚀 Quick Start & Installation Manual
            
            ### 1. Client AddOn Deployment
            * Unpack the compressed `vrotator_addon.zip` archive target straight into your game interface workspace:
              `%WOW_INSTALLATION_DIR%/Interface/AddOns/`
            * Verify that the internal structure matches: `AddOns/vrotator/core/`
            
            ### 2. In-Game Environment Alignment
            * Launch the game client and load your character.
            * **CRITICAL:** Ensure that **EVERY SINGLE SPELL, ITEM, OR AUTOMATION MACRO** is explicitly placed on visible action bars and mapped to physical keyboard key bindings.
            * Do not forget to load and bind your engineered item/consumable macro configurations as specified in the framework documentation.
            
            ### 3. Background Bridge Execution
            * Run the optimized native binary background worker:
              `vrotator_clicker.exe`
            * Keep the active console frame window open during your gaming session to monitor real-time execution telemetry.
          files: |
            build/Release/vrotator_clicker.exe
            build/Release/vrotator_addon.zip
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}